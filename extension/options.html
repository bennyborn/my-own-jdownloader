<!doctype html>
<meta charset="utf-8" />
<meta name="color-scheme" content="light dark" />
<title>My Own JDownloader – Settings</title>
<style>
  /* Same palette as the web interface; light or dark follows the system setting only. */
  :root { --bg: #f6f8fa; --card: #fff; --text: #1f2328; --muted: #59636e; --border: #d0d7de; --accent: #10ac84; --ok: #22a55b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e; --border: #30363d; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 460px; margin: 0 auto; }
  h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 1.2rem; }
  h1 img { width: 28px; height: 28px; }
  .card { display: grid; gap: 16px; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 0.85rem; }
  label small { font-weight: 400; color: var(--muted); }
  label.check { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 8px; }
  label.check small { grid-column: 2; }
  label.check input { width: 16px; height: 16px; padding: 0; accent-color: var(--accent); }
  input { padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font: inherit; }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .actions { display: flex; align-items: center; gap: 12px; }
  button { padding: 8px 18px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
  #msg { color: var(--ok); font-size: 0.85rem; }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--hover); }
  #testmsg { font-size: 0.85rem; color: var(--muted); }
  #testmsg.err { color: #d14343; }
</style>
<main>
  <h1><img src="icons/icon48.png" alt="" /> Settings</h1>
  <div class="card">
    <label>Backend URL <small>The address of your my-own-jdownloader, e.g. http://server:20031</small><input id="url" placeholder="http://server:20031" /></label>
    <label>UI password <small>Leave empty if the backend has no password</small><input id="password" type="password" autocomplete="off" /></label>
    <label class="check"><input id="notify" type="checkbox" /> Notify me about captchas <small>A browser notification when JDownloader waits for a captcha (checked every 30 seconds)</small></label>
    <div class="actions"><button type="button" id="test" class="secondary">Send test notification</button><span id="testmsg"></span></div>
    <label class="check"><input id="cnl" type="checkbox" /> Handle Click'n'Load <small>Pages offering Click'n'Load send their links to your linkgrabber</small></label>
    <div class="actions"><button id="save">Save</button><span id="msg"></span></div>
  </div>
</main>
<script src="options.js"></script>
