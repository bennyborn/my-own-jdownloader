<!doctype html>
<meta charset="utf-8" />
<meta name="color-scheme" content="light dark" />
<title>My Own JDownloader – Settings</title>
<style>
  /* Same palette as the web interface; light or dark follows the system setting only. */
  :root { --bg: #f6f8fa; --card: #fff; --text: #1f2328; --muted: #59636e; --border: #d0d7de; --accent: #10ac84; --ok: #22a55b; --hover: rgba(127, 127, 127, 0.1); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e; --border: #30363d; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 460px; margin: 0 auto; }
  h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 1.2rem; }
  h1 img { width: 28px; height: 28px; }
  .card { display: grid; gap: 16px; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 0.85rem; }
  label small { font-weight: 400; color: var(--muted); }
  label.check { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 8px; }
  label.check small { grid-column: 2; }
  label.check input { width: 16px; height: 16px; padding: 0; accent-color: var(--accent); }
  input, select { padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font: inherit; }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .field { display: grid; gap: 6px; font-weight: 600; font-size: 0.85rem; }
  .field small { font-weight: 400; color: var(--muted); }
  .dd { position: relative; }
  .dd-trigger { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font: inherit; font-weight: 400; text-align: left; }
  .dd-trigger:hover { background: var(--hover); }
  .dd-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .dd-trigger .label, .dd-menu .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd svg { flex: none; }
  .dd .on { color: var(--ok); }
  .dd .off { color: var(--muted); }
  .dd-menu { position: absolute; z-index: 10; top: calc(100% + 6px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
  .dd-menu li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; font-weight: 400; cursor: pointer; }
  .dd-menu li:hover { background: var(--hover); }
  .dd-menu li.active { font-weight: 600; }
  .dd-menu li.offline { color: var(--muted); }
  .dd-menu .state { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  .actions { display: flex; align-items: center; gap: 12px; }
  button { padding: 8px 18px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
  #msg { color: var(--ok); font-size: 0.85rem; }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--hover); }
  #testmsg { font-size: 0.85rem; color: var(--muted); }
  #testmsg.err { color: #d14343; }
</style>
<main>
  <h1><img src="icons/icon48.png" alt="" /> Settings</h1>
  <div class="card">
    <label>Backend URL <small>The address of your my-own-jdownloader, e.g. http://192.168.1.10:3000</small><input id="url" placeholder="http://192.168.1.10:3000" /></label>
    <label>UI password <small>Leave empty if the backend has no password</small><input id="password" type="password" autocomplete="off" /></label>
    <label class="check"><input id="autoTurnstile" type="checkbox" /> Solve Cloudflare Turnstile automatically <small>While the web interface is open in a tab, the hoster page opens in the background; it comes to the front if a click is needed</small></label>
    <label class="check"><input id="notify" type="checkbox" /> Notify me about captchas <small>A browser notification when JDownloader waits for a captcha (checked every 30 seconds)</small></label>
    <div class="actions"><button type="button" id="test" class="secondary">Send test notification</button><span id="testmsg"></span></div>
    <div class="field">
      <span id="cnlLabel">Click'n'Load device <small>Where links from Click'n'Load go to (only matters with several JDownloader devices). "Ask every time" lets you choose on the result card.</small></span>
      <div class="dd" id="cnlDevice">
        <button type="button" class="dd-trigger" id="cnlTrigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="cnlLabel"></button>
        <ul class="dd-menu" id="cnlMenu" role="listbox" hidden></ul>
      </div>
    </div>
    <label class="check"><input id="cnl" type="checkbox" /> Handle Click'n'Load <small>Pages offering Click'n'Load send their links to your linkgrabber</small></label>
    <div class="actions"><button id="save">Save</button><span id="msg"></span></div>
  </div>
</main>
<script src="options.js"></script>
