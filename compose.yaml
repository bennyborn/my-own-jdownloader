services:
  app:
    build: .
    ports:
      - "20031:20031"
    env_file: .env
    restart: unless-stopped

  # Development tooling: all npm/node usage happens in this container, never on the host.
  # Usage: docker compose run --rm dev npm install
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      HOME: /tmp
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/backend/node_modules
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "20031:20031"

volumes:
  node_modules:
  backend_node_modules:
  frontend_node_modules:
